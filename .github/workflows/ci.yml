name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      # all tests run against the pinned FalkorDB image (the service above); the embedded falkordblite build
      # is for local runs only: its graph module fails to load on Linux runners
      - name: tests on the pinned FalkorDB image (V1)
        env: {FALKORDB_EMBEDDED: "0", FALKORDB_HOST: localhost, FALKORDB_PORT: "6379"}
        run: uv run pytest -q
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cd ui && npm ci && npm run typecheck && npm run build
