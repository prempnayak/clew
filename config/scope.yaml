# Where explorers may go (handoff §10.4, §22). Requests to any other origin are aborted.
allowed_origins: ["http://shop:8090"]   # SHOP_URL's origin is always allowed too
deny_paths: ['^/__', '^mailto:', '^tel:', '^javascript:']
max_candidates_per_page: 30
max_input_length: 200
release_meta: app-release              # <meta name="app-release"> on the store's pages
