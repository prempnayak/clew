# Default input cases for the deterministic page reader.
# Fields are matched by their accessible name. A form gets at most `max_cases` cases;
# each case fills every field with that field's value for the case.
max_cases: 3
# Promo-style codes printed on the page (e.g. a banner) are offered as the valid value of code fields.
page_code_pattern: '\b[A-Z]{3,}[0-9]{1,3}\b'
fields:
  - {match: '(?i)e-?mail', valid: '{{account.email}}', invalid: 'nobody@nebula.test', empty: ''}
  - {match: '(?i)password', valid: '{{account.password}}', invalid: 'wrong-password', empty: ''}
  - {match: '(?i)search|query', valid: 'star', invalid: 'zzzzqqq', empty: ''}
  - {match: '(?i)code', valid: '{{page.code}}', invalid: 'BADCODE', empty: ''}
  - {match: '(?i)quantity|qty|tickets?|number of|how many', valid: '2', invalid: '0', empty: ''}
  - {match: '(?i)phone|mobile', valid: '+44 7700 900123', invalid: 'abc', empty: ''}
  - {match: '(?i)name', valid: 'Ada Lovelace', invalid: '', empty: ''}
  - {match: '(?i)address|street', valid: '1 Orbit Way', invalid: '', empty: ''}
  - {match: '(?i)city', valid: 'Bengaluru', invalid: '', empty: ''}
  - {match: '.*', valid: 'test', invalid: '', empty: ''}
# Priorities for deterministic reads (0–10); keywords raise a candidate to `high`.
priority: {form: 6, button: 5, main_link: 4, nav_link: 2, high: 8}
high_keywords: '(?i)cart|checkout|coupon|apply|order|pay|wishlist'
# Mission fallback (no Strategist): extra values for the named field.
mission_values: ['BADCODE', 'save10', '{{repeat:X:200}}', 'EXPIRED5']
