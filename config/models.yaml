# Model IDs and thinking levels per backend. LLM_BACKEND picks the profile:
#   vertex | gemini_api → gemini;  openai → openai (any OpenAI-compatible server: LM Studio, vLLM, Ollama);
#   off → no LLM at all (deterministic page reader and Reporter).
# Confirm Gemini IDs in the Model Garden (V8). Temperature is never set (Gemini 3 default, as Google recommends).
gemini:
  page_reader:     {model: gemini-3.5-flash-lite, thinking_level: low}
  locate:          {model: gemini-3.5-flash-lite, thinking_level: low}
  reporter:        {model: gemini-3.8-flash, thinking_level: low}
  strategist:      {model: gemini-3.8-flash, thinking_level: medium}
openai:          # OPENAI_BASE_URL (e.g. http://localhost:1234/v1 for LM Studio) and OPENAI_API_KEY
  page_reader:     {model: qwen/qwen3-8b}
  locate:          {model: qwen/qwen3-8b}
  reporter:        {model: qwen/qwen3-8b}
  strategist:      {model: qwen/qwen3-8b}
# Uses switched off regardless of backend, e.g. disabled: [strategist]
disabled: []
