[project]
name = "clew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "falkordb==1.8.0",
    "fastapi>=0.141.1",
    "google-adk[mcp]==2.12.0",
    "google-genai==2.31.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "litellm>=1.105.1",
    "mcp==2.3.0",
    "playwright==1.63.0",
    "pydantic>=2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clew", "shop", "scorer"]

[dependency-groups]
dev = [
    "falkordblite==0.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "shop/tests"]
asyncio_mode = "auto"
markers = ["integration: needs the store and Chromium (slow)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
