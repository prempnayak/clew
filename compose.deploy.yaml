# Hosted: only Caddy listens publicly; it routes to the API (which serves the UI) and never to /__* hooks.
services:
  falkordb:   # the FalkorDB Browser, on the VM's localhost only (reach it with: deploy/gcp.sh db)
    ports: ["127.0.0.1:3000:3000"]
  caddy:
    image: caddy:2.10
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    restart: unless-stopped
    depends_on: [api]
volumes:
  caddy-data:
